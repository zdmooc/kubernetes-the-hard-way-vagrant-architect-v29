---
# LEGACY_REFERENCE: canonical Keycloak ownership belongs to keycloak-enterprise-roadmap-v7.
- name: Require runtime-only Keycloak bootstrap credentials
  assert:
    that:
      - lookup('env', 'KC_BOOTSTRAP_ADMIN_USERNAME') | length > 0
      - lookup('env', 'KC_BOOTSTRAP_ADMIN_PASSWORD') | length > 0
    fail_msg: "Inject Keycloak bootstrap credentials through the local environment."
  no_log: true

- name: Installer Docker pour l'extension OIDC pédagogique
  apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: yes

- name: S'assurer que Docker est démarré
  service:
    name: docker
    state: started
    enabled: yes

- name: Créer le répertoire de configuration Keycloak
  file:
    path: /opt/keycloak
    state: directory
    mode: '0755'

- name: Copier la configuration Keycloak de démonstration
  copy:
    dest: /opt/keycloak/docker-compose.yml
    content: |
      services:
        keycloak:
          image: quay.io/keycloak/keycloak:26.1
          command: start-dev
          environment:
            KC_DB: dev-file
            KC_BOOTSTRAP_ADMIN_USERNAME: "{{ lookup('env', 'KC_BOOTSTRAP_ADMIN_USERNAME') }}"
            KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ lookup('env', 'KC_BOOTSTRAP_ADMIN_PASSWORD') }}"
            KC_HOSTNAME: keycloak-0.kubernetes.local
          ports:
            - "8080:8080"
            - "8443:8443"
    mode: '0644'
  no_log: true

- name: Démarrer Keycloak via docker-compose
  command: docker-compose up -d
  args:
    chdir: /opt/keycloak
  register: keycloak_start
  changed_when: "'Creating' in keycloak_start.stdout or 'Starting' in keycloak_start.stdout"
  no_log: true

- name: Attendre que Keycloak soit prêt
  wait_for:
    port: 8080
    delay: 10
    timeout: 300
